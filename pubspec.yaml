name: school_manager
description: "School Manager - Modern Indian School Management System"
publish_to: 'none'
version: 1.0.3+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^4.0.0
  flutter_dotenv: ^5.2.1
  supabase_flutter: ^2.8.0
  fl_chart: ^0.68.0
  confetti: ^0.7.0
  table_calendar: ^3.1.2
  photo_view: ^0.15.0
  excel: ^4.0.3
  file_picker: ^8.0.5
  pdf: ^3.10.8
  printing: ^5.13.1
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  path_provider: ^2.1.3
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  url_launcher: ^6.3.0
  shorebird_code_push: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
